<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Brothers Pizza</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background-color: #09090b; color: #f4f4f5; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 16px; }
  .inp { width: 100%; background: #09090b; border: 1px solid #3f3f46; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; }
  .inp:focus { outline: none; border-color: #ef4444; }
  .btn-red { background: #dc2626; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; }
  .btn-red:hover { background: #b91c1c; }
  .btn-gray { background: #27272a; color: #e4e4e7; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: none; }
  .btn-gray:hover { background: #3f3f46; }
  .tab-btn { padding: 8px 14px; border-radius: 8px; background: #27272a; color: #a1a1aa; font-size: 13px; cursor: pointer; border: none; }
  .tab-btn.active { background: #dc2626; color: #fff; }
  .hide { display: none !important; }
</style>
</head>
<body class="min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="fixed inset-0 bg-zinc-950 flex items-center justify-center p-4 z-50">
    <div class="card w-full max-w-sm text-center">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-red-600 to-amber-500 items-center justify-center text-3xl mb-4">🍕</div>
      <h1 class="font-bold text-xl mb-1">Brothers Pizza</h1>
      <p class="text-xs text-zinc-400 mb-6">Panel Administrativo</p>
      
      <div class="space-y-3 text-left">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Usuario</label>
          <input id="loginUser" type="text" class="inp" placeholder="admin" value="admin">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Contraseña</label>
          <input id="loginPass" type="password" class="inp" placeholder="••••••••" value="admin123">
        </div>
        <div id="loginError" class="hide text-red-400 text-xs bg-red-500/10 p-2 rounded text-center"></div>
        <button onclick="handleLogin()" class="btn-red w-full mt-2">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="hide">
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-30 p-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🍕</span>
        <div>
          <h2 class="font-bold text-sm">Brothers Pizza</h2>
          <p id="userRoleDisplay" class="text-xs text-emerald-400">Administrador</p>
        </div>
      </div>
      <button onclick="handleLogout()" class="btn-gray text-xs">Cerrar Sesión</button>
    </header>

    <nav class="bg-zinc-900/50 border-b border-zinc-800 p-2 flex gap-2 overflow-x-auto max-w-5xl mx-auto">
      <button class="tab-btn active" onclick="switchTab('pos')">🛒 POS</button>
      <button class="tab-btn" onclick="switchTab('menu')">📋 Menú</button>
      <button class="tab-btn" onclick="switchTab('stats')">📊 Ventas</button>
    </nav>

    <main class="max-w-5xl mx-auto p-4 space-y-4">
      <!-- TAB POS -->
      <section id="tab-pos" class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-2 space-y-3">
          <input id="searchProd" type="text" class="inp" placeholder="Buscar producto..." oninput="renderPosProducts(this.value)">
          <div id="posProductsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>
        <div class="card h-fit">
          <h3 class="font-bold text-sm mb-3">Orden Actual</h3>
          <div id="cartItemsList" class="space-y-2 max-h-60 overflow-y-auto mb-3 text-xs"></div>
          <div class="border-t border-zinc-800 pt-2 space-y-1 text-xs mb-3">
            <div class="flex justify-between"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
            <div class="flex justify-between font-bold text-sm text-red-500"><span>Total</span><span id="cartTotal">$0.00</span></div>
          </div>
          <button onclick="checkout()" class="btn-red w-full text-sm">Cobrar Efectivo</button>
        </div>
      </section>

      <!-- TAB MENU -->
      <section id="tab-menu" class="hide space-y-4">
        <div class="card">
          <h3 class="font-bold text-sm mb-3">Pizzas del Menú</h3>
          <div id="menuPizzas" class="space-y-2"></div>
        </div>
      </section>

      <!-- TAB STATS -->
      <section id="tab-stats" class="hide space-y-4">
        <div class="card">
          <h3 class="font-bold text-sm mb-3">Historial de Ventas</h3>
          <div id="salesHistoryList" class="space-y-2 text-xs"></div>
        </div>
      </section>
    </main>
  </div>

<script>
const DEFAULT_MENU = {
  pizzas: [
    { id: 1, nombre: "Pizza Pepperoni", precio: 9.00, desc: "Pepperoni y mozzarella" },
    { id: 2, nombre: "Pizza Margarita", precio: 8.00, desc: "Mozzarella y albahaca" },
    { id: 3, nombre: "Pizza Hawaiana", precio: 8.50, desc: "Jamón y piña" }
  ]
};

let menu = JSON.parse(localStorage.getItem('bp_menu')) || DEFAULT_MENU;
let sales = JSON.parse(localStorage.getItem('bp_sales')) || [];
let session = JSON.parse(localStorage.getItem('bp_session')) || null;
let cart = [];

function init() {
  if (session) {
    showApp();
  } else {
    showLogin();
  }
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('appScreen').classList.add('hide');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('appScreen').classList.remove('hide');
  document.getElementById('userRoleDisplay').textContent = session.nombre + ' (' + session.rol + ')';
  renderPosProducts();
  renderMenu();
  renderSales();
}

function handleLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');

  if (u === 'admin' && p === 'admin123') {
    session = { nombre: 'Administrador', rol: 'admin' };
    localStorage.setItem('bp_session', JSON.stringify(session));
    err.classList.add('hide');
    showApp();
  } else {
    err.textContent = 'Usuario o contraseña incorrectos (Usa: admin / admin123)';
    err.classList.remove('hide');
  }
}

function handleLogout() {
  localStorage.removeItem('bp_session');
  session = null;
  showLogin();
}

function switchTab(tab) {
  ['pos', 'menu', 'stats'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hide', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    const tabs = ['pos', 'menu', 'stats'];
    btn.classList.toggle('active', tabs[idx] === tab);
  });
}

function renderPosProducts(filter = '') {
  const grid = document.getElementById('posProductsGrid');
  const filtered = menu.pizzas.filter(p => p.nombre.toLowerCase().includes(filter.toLowerCase()));
  
  grid.innerHTML = filtered.map(p => `
    <div onclick="addToCart(${p.id})" class="card cursor-pointer hover:border-red-500 transition p-3">
      <div class="h-20 bg-zinc-800 rounded-lg mb-2 flex items-center justify-center text-3xl">🍕</div>
      <h4 class="font-semibold text-xs truncate">${p.nombre}</h4>
      <p class="text-amber-400 font-bold text-sm mt-1">$${p.precio.toFixed(2)}</p>
    </div>
  `).join('') || '<p class="col-span-full text-center text-zinc-500 text-xs py-4">No hay productos</p>';
}

function addToCart(id) {
  const item = menu.pizzas.find(p => p.id === id);
  if (!item) return;
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...item, qty: 1 });
  }
  renderCart();
}

function renderCart() {
  const list = document.getElementById('cartItemsList');
  let subtotal = 0;

  list.innerHTML = cart.length === 0 ? '<p class="text-center text-zinc-500 py-2">Carrito vacío</p>' : cart.map((c, i) => {
    subtotal += c.precio * c.qty;
    return `
      <div class="flex justify-between items-center bg-zinc-900 p-2 rounded">
        <div>
          <p class="font-semibold">${c.nombre}</p>
          <p class="text-zinc-400">$${c.precio.toFixed(2)} x ${c.qty}</p>
        </div>
        <button onclick="removeFromCart(${i})" class="text-red-400 px-2 py-1"><i class="fa-solid fa-trash text-xs"></i></button>
      </div>
    `;
  }).join('');

  document.getElementById('cartSubtotal').textContent = '$' + subtotal.toFixed(2);
  document.getElementById('cartTotal').textContent = '$' + subtotal.toFixed(2);
}

function removeFromCart(index) {
  cart.splice(index, 1);
  renderCart();
}

function checkout() {
  if (cart.length === 0) {
    alert('El carrito está vacío');
    return;
  }
  const total = cart.reduce((sum, item) => sum + (item.precio * item.qty), 0);
  const newSale = {
    id: Date.now(),
    date: new Date().toLocaleString(),
    items: [...cart],
    total: total
  };
  sales.unshift(newSale);
  localStorage.setItem('bp_sales', JSON.stringify(sales));
  cart = [];
  renderCart();
  renderSales();
  alert('¡Venta cobrada con éxito!');
}

function renderMenu() {
  const container = document.getElementById('menuPizzas');
  container.innerHTML = menu.pizzas.map(p => `
    <div class="flex justify-between items-center bg-zinc-900 p-3 rounded-lg text-xs">
      <div>
        <p class="font-bold text-sm">${p.nombre}</p>
        <p class="text-zinc-400">${p.desc}</p>
      </div>
      <p class="text-amber-400 font-bold text-sm">$${p.precio.toFixed(2)}</p>
    </div>
  `).join('');
}

function renderSales() {
  const container = document.getElementById('salesHistoryList');
  container.innerHTML = sales.length === 0 ? '<p class="text-center text-zinc-500 py-4">No hay ventas registradas</p>' : sales.map(s => `
    <div class="bg-zinc-900 p-3 rounded-lg flex justify-between items-center">
      <div>
        <p class="font-bold">Venta #${s.id.toString().slice(-4)}</p>
        <p class="text-zinc-400">${s.date}</p>
      </div>
      <p class="text-emerald-400 font-bold text-sm">$${s.total.toFixed(2)}</p>
    </div>
  `).join('');
}

window.onload = init;
</script>
</body>
</html>
