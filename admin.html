<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Admin · Brother's Pizza</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
  * { font-family: 'Outfit', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { overscroll-behavior-y: contain; }

  /* iOS: 100vh incluye barra. Usamos dvh con fallback */
  .full-h { height: 100vh; height: 100dvh; }
  .min-full-h { min-height: 100vh; min-height: 100dvh; }

  body {
    background: #09090b; color: #f4f4f5;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(220,38,38,0.14) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(245,158,11,0.12) 0%, transparent 45%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 42px 42px; pointer-events: none; z-index: 0;
  }

  /* Glass con fallback para iOS <15 */
  .glass {
    background: rgba(24,24,27,0.92);
    border: 1px solid rgba(255,255,255,0.06);
  }
  @supports (backdrop-filter: blur(14px)) or (-webkit-backdrop-filter: blur(14px)) {
    .glass { background: linear-gradient(135deg, rgba(24,24,27,0.85), rgba(24,24,27,0.65)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  }

  .card { background: linear-gradient(145deg, rgba(24,24,27,0.95), rgba(15,15,18,0.9)); border: 1px solid #27272a; border-radius: 16px; padding: 14px; transition: all .3s; position: relative; }
  @media (min-width: 640px) { .card { border-radius: 18px; padding: 18px; } }
  .card:hover { border-color: #3f3f46; }

  /* iOS: input mínimo 16px para NO hacer zoom automático */
  .inp { width: 100%; background: rgba(9,9,11,0.8); border: 1px solid #3f3f46; border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 16px; transition: all .2s; min-height: 44px; -webkit-appearance: none; appearance: none; }
  .inp:focus { outline: none; border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
  select.inp { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 38px; }
  input[type="number"] { -moz-appearance: textfield; -webkit-appearance: none; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* iOS: botones sin outline azul */
  button { -webkit-appearance: none; appearance: none; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626 50%, #b91c1c); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: all .25s; box-shadow: 0 6px 20px rgba(220,38,38,0.35); min-height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .btn-red:active { transform: scale(.97); }
  .btn-red:disabled { opacity: .5; cursor: not-allowed; }
  .btn-gray { background: linear-gradient(135deg, #27272a, #1f1f23); color: #e4e4e7; padding: 12px 18px; border-radius: 12px; cursor: pointer; border: 1px solid #3f3f46; transition: all .2s; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .btn-gray:active { transform: scale(.97); }
  .btn-green { background: linear-gradient(135deg, #10b981, #059669 50%, #047857); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .btn-green:active { transform: scale(.97); }
  .btn-amber { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .btn-amber:active { transform: scale(.97); }
  .tab-btn { padding: 10px 14px; border-radius: 12px; background: rgba(24,24,27,0.7); border: 1px solid #27272a; color: #a1a1aa; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap; min-height: 40px; display: inline-flex; align-items: center; }
  .tab-btn.active { background: linear-gradient(135deg, #ef4444, #dc2626); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(220,38,38,0.45); }
  .hide { display: none !important; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

  .fade-in { animation: fadeIn .3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  .slide-up { animation: slideUp .35s; }
  @keyframes slideUp { from { opacity:0; transform: translateY(20px);} to {opacity:1; transform:none;} }
  .slide-from-bottom { animation: slideFromBottom .35s; }
  @keyframes slideFromBottom { from { transform: translateY(100%);} to { transform: translateY(0);} }
  .toast-anim { animation: slideIn .3s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(30px);} to {opacity:1; transform:none;} }

  .prod-card { cursor: pointer; transition: transform .2s; }
  .prod-card:active { transform: scale(.96); }
  @media (min-width: 1024px) { .prod-card:hover { transform: translateY(-4px); border-color: rgba(239,68,68,0.6) !important; } }
  .prod-emoji-box { background: linear-gradient(135deg, #1a1a20, #0e0e11); }

  .glow-red { box-shadow: 0 0 30px rgba(220,38,38,0.4); }
  .glow-green { box-shadow: 0 0 30px rgba(16,185,129,0.4); }
  .pizza-float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulseDot 2s infinite; flex-shrink: 0; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7);} 70% { box-shadow: 0 0 0 10px rgba(16,185,129,0);} 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0);} }

  .badge-slice { background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(245,158,11,0.08)); color:#fbbf24; border: 1px solid rgba(245,158,11,0.35); }
  .badge-pizza { background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(239,68,68,0.08)); color:#f87171; border: 1px solid rgba(239,68,68,0.35); }
  .badge-bebida { background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(59,130,246,0.08)); color:#60a5fa; border: 1px solid rgba(59,130,246,0.35); }
  .badge-extra { background: linear-gradient(135deg, rgba(217,70,239,0.18), rgba(217,70,239,0.08)); color:#e879f9; border: 1px solid rgba(217,70,239,0.35); }

  .brand-gradient { background: linear-gradient(135deg, #ef4444, #f59e0b 50%, #ef4444); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 4s infinite; }
  @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .stock-bar { height: 6px; border-radius: 3px; background: #27272a; overflow: hidden; }
  .stock-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
  .number-gradient { background: linear-gradient(135deg, #f87171, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .worker-avatar { background: linear-gradient(135deg, rgba(245,158,11,0.25), rgba(239,68,68,0.25)); }

  /* Navegación táctil iOS */
  .nav-scroll { scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; }
  .nav-scroll::-webkit-scrollbar { display: none; }

  /* MODALES iOS */
  .modal-backdrop { background: rgba(0,0,0,0.9); }
  @supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)) {
    .modal-backdrop { background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.85), rgba(0,0,0,0.95)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  }

  /* iOS: bottom sheet con altura real */
  .sheet {
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    border-radius: 24px 24px 0 0;
    animation: slideFromBottom .35s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width: 640px) {
    .sheet { max-width: 28rem; border-radius: 24px; animation: slideUp .35s; }
  }
  .sheet-lg { max-width: 32rem; }
  .drag-handle { width: 44px; height: 4px; background: #3f3f46; border-radius: 2px; margin: 8px auto 6px; }
  @media (min-width: 640px) { .drag-handle { display: none; } }

  /* Cart drawer iOS */
  .cart-drawer-panel { max-height: 88vh; max-height: 88dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* iOS Safe areas */
  .safe-top { padding-top: env(safe-area-inset-top, 0); }
  .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }

  /* Bloqueo de scroll iOS-friendly */
  body.locked { overflow: hidden; position: fixed; width: 100%; }

  /* IMPRESIÓN TÉRMICA (se usa iframe en iOS) */
  #printArea { display: none; }
  @page { size: 80mm auto; margin: 0; }
  @media print {
    body * { visibility: hidden !important; }
    #printArea, #printArea * { visibility: visible !important; }
    #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 76mm; padding: 2mm; color: #000 !important; background: #fff !important; font-family: 'Courier New', monospace !important; font-size: 11px; line-height: 1.28; }
    #printArea * { color: #000 !important; }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- LOGIN -->
  <div id="loginScreen" class="fixed inset-0 flex items-center justify-center p-4 z-50" style="height:100dvh;">
    <div class="absolute inset-0" style="background: radial-gradient(circle at 20% 20%, rgba(220,38,38,0.2), transparent 50%), radial-gradient(circle at 80% 80%, rgba(245,158,11,0.18), transparent 50%);"></div>
    <div class="glass w-full max-w-md text-center shadow-2xl rounded-3xl p-6 sm:p-8 slide-up relative z-10 safe-top safe-bottom">
      <div class="inline-flex w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-gradient-to-br from-red-500 via-red-600 to-amber-500 items-center justify-center text-4xl sm:text-5xl mb-5 shadow-2xl glow-red pizza-float">🍕</div>
      <h1 class="font-black text-2xl sm:text-3xl mb-1 tracking-tight brand-gradient">Brother's Pizza</h1>
      <p class="text-xs text-zinc-400 mb-6 font-medium tracking-wide uppercase">Panel Gráfico & POS</p>
      <div class="space-y-4 text-left">
        <div><label class="block text-xs font-semibold text-zinc-400 mb-1.5 uppercase tracking-wider">Usuario</label>
          <div class="relative"><i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
            <input id="loginUser" type="text" class="inp pl-11" placeholder="admin" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div></div>
        <div><label class="block text-xs font-semibold text-zinc-400 mb-1.5 uppercase tracking-wider">Contraseña</label>
          <div class="relative"><i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
            <input id="loginPass" type="password" class="inp pl-11" placeholder="••••••••" autocomplete="current-password"></div></div>
        <div id="loginError" class="hide text-red-400 text-xs bg-red-500/10 border border-red-500/20 p-3 rounded-xl text-center font-medium"></div>
        <button type="button" onclick="handleLogin()" class="btn-red w-full mt-2"><i class="fa-solid fa-right-to-bracket mr-2"></i> Ingresar</button>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="hide flex-1 flex flex-col relative z-10">
    <header class="glass border-b border-zinc-800/80 sticky top-0 z-30 safe-top">
      <div class="px-3 sm:px-6 py-3 flex justify-between items-center gap-2">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-red-500 via-red-600 to-amber-500 flex items-center justify-center text-lg sm:text-xl shadow-lg glow-red shrink-0">🍕</div>
          <div class="min-w-0">
            <h2 class="font-bold text-xs sm:text-sm tracking-wide text-white truncate">Brother's Pizza</h2>
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="pulse-dot"></span>
              <p id="userRoleDisplay" class="text-[10px] sm:text-xs text-emerald-400 font-semibold truncate">Admin</p>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div id="clockDisplay" class="hidden md:flex text-[11px] text-zinc-400 font-mono bg-zinc-950/70 px-3 py-2 rounded-xl border border-zinc-800"></div>
          <button type="button" onclick="handleLogout()" class="btn-gray text-xs py-2.5 px-3"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline ml-2">Salir</span></button>
        </div>
      </div>
      <nav id="appNav" class="bg-zinc-900/40 border-t border-zinc-800/60 px-3 sm:px-6 py-2 flex gap-2 overflow-x-auto nav-scroll">
        <button type="button" class="tab-btn active text-xs" data-tab="pos" onclick="switchTab('pos')"><i class="fa-solid fa-cash-register mr-1.5"></i> POS</button>
        <button type="button" class="tab-btn admin-only text-xs" data-tab="menu" onclick="switchTab('menu')"><i class="fa-solid fa-utensils mr-1.5"></i> Menú</button>
        <button type="button" class="tab-btn admin-only text-xs" data-tab="stock" onclick="switchTab('stock')"><i class="fa-solid fa-boxes-stacked mr-1.5"></i> Stock</button>
        <button type="button" class="tab-btn admin-only text-xs" data-tab="workers" onclick="switchTab('workers')"><i class="fa-solid fa-hand-holding-dollar mr-1.5"></i> Ayudantes</button>
        <button type="button" class="tab-btn admin-only text-xs" data-tab="users" onclick="switchTab('users')"><i class="fa-solid fa-users mr-1.5"></i> Usuarios</button>
        <button type="button" class="tab-btn admin-only text-xs" data-tab="stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-line mr-1.5"></i> Reportes</button>
      </nav>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-4 sm:space-y-6 pb-28 lg:pb-6">

      <!-- POS -->
      <section id="tab-pos" class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
        <div class="lg:col-span-2 space-y-3 sm:space-y-4">
          <div class="flex flex-col sm:flex-row gap-2 sm:gap-3">
            <div class="relative flex-1"><span class="absolute inset-y-0 left-0 pl-4 flex items-center text-zinc-500"><i class="fa-solid fa-search text-xs"></i></span>
              <input id="searchProd" type="text" class="inp pl-11" placeholder="Buscar producto..." oninput="onSearchInput(this.value)" autocapitalize="none" autocorrect="off"></div>
            <div id="posCategories" class="flex gap-2 overflow-x-auto pb-1 nav-scroll">
              <button type="button" data-cat="todos" onclick="filterCategory('todos')" class="tab-btn active text-xs">Todos</button>
              <button type="button" data-cat="slice" onclick="filterCategory('slice')" class
