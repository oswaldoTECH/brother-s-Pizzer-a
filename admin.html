<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Brothers Pizza</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: system-ui, sans-serif; }
  .inp { width:100%; background:#09090b; border:1px solid #3f3f46; border-radius:10px; padding:10px; color:#fff; font-size:14px; }
  .inp:focus { outline:none; border-color:#ef4444; }
  .btn-red { background:#dc2626; color:#fff; padding:10px 14px; border-radius:10px; font-weight:600; font-size:14px; }
  .btn-gray { background:#27272a; color:#e4e4e7; padding:10px 14px; border-radius:10px; font-size:14px; }
  .tabbtn { padding:8px 14px; border-radius:10px; background:#27272a; color:#a1a1aa; font-size:13px; white-space:nowrap; }
  .tabbtn.act { background:#dc2626; color:#fff; }
  .card { background:#18181b; border:1px solid #27272a; border-radius:14px; padding:14px; }
  .hide { display:none !important; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<!-- LOGIN -->
<div id="login" class="fixed inset-0 bg-zinc-950 flex items-center justify-center p-4 z-50">
  <div class="card w-full max-w-sm">
    <div class="text-center mb-5">
      <div class="inline-block w-12 h-12 rounded-xl bg-red-600 text-white text-xl leading-[3rem]">🍕</div>
      <h1 class="font-bold mt-2">Brothers Pizza · Admin</h1>
    </div>
    <input id="lu" class="inp mb-2" value="admin" placeholder="Usuario">
    <input id="lp" type="password" class="inp mb-2" value="admin123" placeholder="Contraseña">
    <div id="lerr" class="hide text-red-400 text-xs text-center bg-red-500/10 py-2 rounded mb-2"></div>
    <button onclick="doLogin()" class="btn-red w-full">Ingresar</button>
    <button onclick="localStorage.clear();location.reload()" class="text-xs text-zinc-500 w-full mt-3">🔧 Reparar acceso</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-3 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-red-600 flex items-center justify-center">🍕</div>
        <div>
          <p class="font-bold text-sm">Brothers Pizza</p>
          <p id="whoami" class="text-[10px] text-zinc-500">—</p>
        </div>
      </div>
      <div class="flex gap-2">
        <a href="index.html" target="_blank" class="btn-gray text-xs">👁️ Ver menú</a>
        <button onclick="logout()" class="btn-gray text-xs">Salir</button>
      </div>
    </div>
    <div class="max-w-5xl mx-auto px-3 pb-2 flex gap-1 overflow-x-auto">
      <button class="tabbtn act" data-t="pos">🍕 POS</button>
      <button class="tabbtn" data-t="menu">📋 Menú</button>
      <button class="tabbtn" data-t="stock">📦 Stock</button>
      <button class="tabbtn" data-t="staff">👥 Staff</button>
      <button class="tabbtn" data-t="fin">💰 Finanzas</button>
      <button class="tabbtn" data-t="cash">💵 Caja</button>
      <button class="tabbtn" data-t="stats">📊 Ventas</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-3 pb-24">

    <!-- POS -->
    <section id="t-pos">
      <div class="grid lg:grid-cols-3 gap-3">
        <div class="lg:col-span-2">
          <input id="pq" class="inp mb-2" placeholder="🔍 Buscar...">
          <div id="pgrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
        </div>
        <div class="card h-fit">
          <div class="flex justify-between mb-2">
            <b class="text-sm">🛒 Orden <span id="cc" class="text-red-500">(0)</span></b>
            <button onclick="clearCart()" class="text-xs text-zinc-500">Limpiar</button>
          </div>
          <input id="cliente" class="inp mb-2 text-sm" value="Mesa 1">
          <div id="cartList" class="space-y-1 max-h-60 overflow-y-auto mb-2"></div>
          <div class="text-xs border-t border-zinc-800 pt-2 space-y-1">
            <div class="flex justify-between"><span>Subtotal</span><span id="cSub">$0</span></div>
            <div class="flex justify-between"><span>IVA</span><span id="cTax">$0</span></div>
            <div class="flex justify-between font-bold text-base pt-1"><span>Total</span><span id="cTot" class="text-red-500">$0</span></div>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button onclick="pay('Efectivo')" class="btn-gray">💵 Efectivo</button>
            <button onclick="pay('Tarjeta')" class="btn-red">💳 Tarjeta</button>
          </div>
        </div>
      </div>
    </section>

    <!-- MENU -->
    <section id="t-menu" class="hide">
      <div class="flex justify-between mb-3">
        <h2 class="font-bold">📋 Menú</h2>
        <button onclick="editPizza(0)" class="btn-red">+ Nueva pizza</button>
      </div>
      <div id="sizesBox" class="grid grid-cols-3 gap-2 mb-3"></div>
      <button onclick="editSizes()" class="text-xs text-red-400 mb-3">✏️ Editar tamaños</button>
      <div id="pizzaList" class="space-y-2"></div>
    </section>

    <!-- STOCK -->
    <section id="t-stock" class="hide">
      <div class="flex justify-between mb-3">
        <h2 class="font-bold">📦 Inventario</h2>
        <button onclick="editInsumo(0)" class="btn-red">+ Nuevo</button>
      </div>
      <div id="stockList" class="space-y-2"></div>
    </section>

    <!-- STAFF -->
    <section id="t-staff" class="hide">
      <div class="flex justify-between mb-3">
        <h2 class="font-bold">👥 Trabajadores</h2>
        <button onclick="editStaff(0)" class="btn-red">+ Nuevo</button>
      </div>
      <div id="staffList" class="space-y-2"></div>
    </section>

    <!-- FINANZAS -->
    <section id="t-fin" class="hide">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-3">
        <div class="card"><p class="text-[10px] text-emerald-400 font-bold">INGRESOS</p><p id="fIn" class="text-xl font-bold">$0</p></div>
        <div class="card"><p class="text-[10px] text-red-400 font-bold">EGRESOS</p><p id="fEx" class="text-xl font-bold">$0</p></div>
        <div class="card"><p class="text-[10px] text-amber-400 font-bold">NÓMINA</p><p id="fPay" class="text-xl font-bold">$0</p></div>
        <div class="card"><p class="text-[10px] text-blue-400 font-bold">BALANCE</p><p id="fBal" class="text-xl font-bold">$0</p></div>
      </div>
      <div class="flex gap-2 mb-3">
        <button class="tabbtn act" data-f="salary">💼 Sueldos</button>
        <button class="tabbtn" data-f="exp">🧾 Gastos</button>
        <button class="tabbtn" data-f="debt">💳 Deudas</button>
      </div>
      <div id="f-salary"><div id="salaryList" class="space-y-2"></div></div>
      <div id="f-exp" class="hide">
        <button onclick="newExpense()" class="btn-red mb-3">+ Nuevo gasto</button>
        <div id="expList" class="space-y-2"></div>
      </div>
      <div id="f-debt" class="hide">
        <button onclick="newDebt()" class="btn-red mb-3">+ Nueva deuda</button>
        <div id="debtList" class="space-y-2"></div>
      </div>
    </section>

    <!-- CAJA -->
    <section id="t-cash" class="hide">
      <div class="grid grid-cols-3 gap-2 mb-3">
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">ESTADO</p><p id="kState" class="text-base font-bold">—</p></div>
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">ESPERADO</p><p id="kExp" class="text-xl font-bold text-emerald-400">$0</p></div>
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">DIF.</p><p id="kDif" class="text-xl font-bold">$0</p></div>
      </div>
      <div class="card mb-3 space-y-2">
        <div class="grid grid-cols-3 gap-2">
          <input id="cashOpen" type="number" step="0.01" class="inp" placeholder="Apertura">
          <button onclick="openCash()" class="btn-gray">🔓 Abrir</button>
          <button onclick="closeCash()" class="btn-red">🔒 Cerrar</button>
        </div>
        <input id="cashCount" type="number" step="0.01" class="inp" placeholder="Efectivo contado">
        <p id="cashHint" class="text-[11px] text-zinc-500"></p>
      </div>
      <div id="cashHist" class="space-y-2"></div>
    </section>

    <!-- STATS -->
    <section id="t-stats" class="hide">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-3">
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">HOY</p><p id="sT" class="text-xl font-bold">$0</p></div>
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">ÓRDENES</p><p id="sO" class="text-xl font-bold">0</p></div>
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">MES</p><p id="sM" class="text-xl font-bold">$0</p></div>
        <div class="card"><p class="text-[10px] text-zinc-500 font-bold">TICKET</p><p id="sA" class="text-xl font-bold">$0</p></div>
      </div>
      <div id="salesList" class="space-y-2"></div>
    </section>

  </main>
</div>

<!-- MODAL -->
<div id="modal" class="hide fixed inset-0 z-40 bg-black/70 flex items-end sm:items-center justify-center">
  <div id="modalBody" class="bg-zinc-900 w-full sm:max-w-md max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5"></div>
</div>

<script>
// ==================== STORAGE ====================
const K = { M:"bp_menu", S:"bp_sales", I:"bp_inventory", U:"bp_staff", SE:"bp_session", P:"bp_payroll", E:"bp_expenses", D:"bp_debts", C:"bp_cash" };

const DEF_M = {
  tamanos:[
    {id:"personal",label:"Personal",precio:5,porciones:4},
    {id:"mediana",label:"Mediana",precio:9,porciones:10},
    {id:"familiar",label:"Familiar",precio:13,porciones:12}
  ],
  pizzas:[
    {id:1,nombre:"Pizza Pepperoni",desc:"Pepperoni y mozzarella",badge:"hot"},
    {id:2,nombre:"Pizza Margarita",desc:"Mozzarella y tomate"},
    {id:3,nombre:"Pizza Hawaiana",desc:"Jamón y piña"},
    {id:4,nombre:"Pizza de Jamón",desc:"Jamón y mozzarella",badge:"new"}
  ],
  porcion:{id:200,nombre:"Porción de Pizza",precio:1.25},
  cola:{id:300,nombre:"Cola 1L",precio:0.75}
};

const DEF_I = [
  {id:1,nombre:"Harina",unidad:"kg",stock:25,min:10,costo:1.20,prov:"Molinos"},
  {id:2,nombre:"Queso",unidad:"kg",stock:8,min:5,costo:6.50,prov:"Lácteos"},
  {id:3,nombre:"Pepperoni",unidad:"kg",stock:4,min:3,costo:8,prov:"Carnes"},
  {id:4,nombre:"Jamón",unidad:"kg",stock:2,min:3,costo:5.50,prov:"Carnes"},
  {id:5,nombre:"Cola 1L",unidad:"botella",stock:20,min:12,costo:0.50,prov:"Distribuidora"}
];

const DEF_U = [
  {id:1,nombre:"Administrador",usuario:"admin",pass:"admin123",rol:"admin",activo:true,emoji:"👑",sueldo:600},
  {id:2,nombre:"Cajero",usuario:"cajero",pass:"cajero123",rol:"cajero",activo:true,emoji:"🧑‍🍳",sueldo:400}
];

// ==================== HELPERS ====================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const money = v => "$" + Number(v).toFixed(2);
const uid = () => Date.now() + Math.floor(Math.random()*1000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rj = (k,f) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):f; } catch { return f; } };
const wj = (k,v) => { localStorage.setItem(k, JSON.stringify(v)); };

// ==================== SEED ====================
(function seed(){
  let m = rj(K.M,null);
  if (!m || !m.pizzas || !m.tamanos || !m.porcion || !m.cola) wj(K.M, DEF_M);

  if (!Array.isArray(rj(K.I,null))) wj(K.I, DEF_I);

  let st = rj(K.U,[]);
  if (!Array.isArray(st)) st = [];
  st = st.filter(x => x && x.usuario && x.pass);
  const ai = st.findIndex(x => x.usuario === "admin");
  if (ai === -1) st.unshift(DEF_U[0]);
  else { st[ai].pass = "admin123"; st[ai].rol = "admin"; st[ai].activo = true; if (!st[ai].sueldo) st[ai].sueldo = 600; }
  if (!st.find(x => x.usuario === "cajero")) st.push(DEF_U[1]);
  wj(K.U, st);

  if (!Array.isArray(rj(K.S,null))) wj(K.S,[]);
  if (!Array.isArray(rj(K.P,null))) wj(K.P,[]);
  if (!Array.isArray(rj(K.E,null))) wj(K.E,[]);
  if (!Array.isArray(rj(K.D,null))) wj(K.D,[]);
  if (!Array.isArray(rj(K.C,null))) wj(K.C,[]);
})();

// ==================== STATE ====================
let MENU = rj(K.M, DEF_M);
let SALES = rj(K.S, []);
let INV = rj(K.I, DEF_I);
let STAFF = rj(K.U, DEF_U);
let PAY = rj(K.P, []);
let EXP = rj(K.E, []);
let DEBT = rj(K.D, []);
let CASH = rj(K.C, []);
let SESSION = rj(K.SE, null);
let cart = [];

// ==================== IMÁGENES ====================
const IMG = {
  pepperoni:"https://images.unsplash.com/photo-1628840042765-356cda07504e?w=300&q=70",
  margarita:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=300&q=70",
  hawaiana:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300&q=70",
  jamon:"https://images.unsplash.com/photo-1594007654729-407eedc4be65?w=300&q=70",
  cola:"https://images.unsplash.com/photo-1554866585-cd94860890b7?w=300&q=70",
  slice:"https://images.unsplash.com/photo-1595854341625-f33ee10dbf94?w=300&q=70",
  def:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300&q=70"
};
function imgOf(n="") {
  n = n.toLowerCase();
  if (n.includes("pepperoni")) return IMG.pepperoni;
  if (n.includes("margarita")) return IMG.margarita;
  if (n.includes("hawaiana")) return IMG.hawaiana;
  if (n.includes("jamón") || n.includes("jamon")) return IMG.jamon;
  if (n.includes("cola") || n.includes("coca")) return IMG.cola;
  if (n.includes("porci")) return IMG.slice;
  return IMG.def;
}

// ==================== MODAL ====================
function modal(html) { $("#modalBody").innerHTML = html; $("#modal").classList.remove("hide"); }
function closeModal() { $("#modal").classList.add("hide"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

// ==================== LOGIN ====================
function doLogin() {
  const u = $("#lu").value.trim(), p = $("#lp").value;
  let user = STAFF.find(x => x.usuario === u && x.pass === p && x.activo);
  if (!user) {
    const d = DEF_U.find(x => x.usuario === u && x.pass === p);
    if (d) { STAFF = [...DEF_U]; wj(K.U, STAFF); user = d; }
  }
  if (!user) {
    $("#lerr").textContent = "Usuario o contraseña incorrectos";
    $("#lerr").classList.remove("hide");
    return;
  }
  SESSION = { id:user.id, nombre:user.nombre, rol:user.rol };
  wj(K.SE, SESSION);
  startApp();
}
function logout() {
  if (!confirm("¿Cerrar sesión?")) return;
  localStorage.removeItem(K.SE);
  location.reload();
}
function startApp() {
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#whoami").textContent = `${SESSION.nombre} · ${SESSION.rol}`;
  renderAll();
}

// ==================== TABS ====================
function showTab(t) {
  $$("main > section").forEach(s => s.classList.add("hide"));
  const el = $("#t-" + t); if (el) el.classList.remove("hide");
  $$(".tabbtn[data-t]").forEach(b => b.classList.toggle("act", b.dataset.t === t));
}
$$(".tabbtn[data-t]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.t)));

// ==================== POS ====================
function getProds() {
  const l = [];
  MENU.pizzas.forEach(p => MENU.tamanos.forEach(t => l.push({
    key:`p${p.id}-${t.id}`, tipo:"pizza", nombre:`${p.nombre} ${t.label}`, precio:t.precio, img:imgOf(p.nombre)
  })));
  l.push({ key:"porcion", tipo:"porcion", nombre:"Porción pizza", precio:MENU.porcion.precio, img:IMG.slice });
  l.push({ key:"cola", tipo:"extra", nombre:MENU.cola.nombre, precio:MENU.cola.precio, img:IMG.cola });
  return l;
}
function renderPOS(q="") {
  let list = getProds();
  if (q) list = list.filter(p => p.nombre.toLowerCase().includes(q.toLowerCase()));
  $("#pgrid").innerHTML = list.map((p,i) => `
    <button onclick="addCart(${i})" data-idx="${i}" class="prod-card bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden text-left hover:border-red-600">
      <div class="h-20 bg-zinc-800 overflow-hidden">
        <img src="${p.img}" class="w-full h-full object-cover" onerror="this.src='${IMG.def}'">
      </div>
      <div class="p-2">
        <p class="text-[11px] font-semibold leading-tight line-clamp-2 min-h-[2rem]">${esc(p.nombre)}</p>
        <p class="text-amber-400 font-bold text-sm mt-1">${money(p.precio)}</p>
      </div>
    </button>
  `).join("") || `<p class="col-span-full text-center text-zinc-500 py-8 text-sm">Sin resultados</p>`;

  // Guardar la lista actual para addCart
  window._posList = list;
}
$("#pq").addEventListener("input", e => renderPOS(e.target.value));

function addCart(i) {
  const p = window._posList[i];
  if (!p) return;
  const f = cart.find(x => x.key === p.key);
  if (f) f.cantidad++; else cart.push({ ...p, cantidad:1 });
  renderCart();
}
function changeQty(i,d) { cart[i].cantidad += d; if (cart[i].cantidad <= 0) cart.splice(i,1); renderCart(); }
function clearCart() { cart = []; renderCart(); }
function renderCart() {
  const cnt = cart.reduce((s,i)=>s+i.cantidad,0);
  const sub = cart.reduce((s,i)=>s+i.precio*i.cantidad,0);
  const tax = sub * 0.12;
  $("#cc").textContent = `(${cnt})`;
  $("#cSub").textContent = money(sub);
  $("#cTax").textContent = money(tax);
  $("#cTot").textContent = money(sub+tax);
  $("#cartList").innerHTML = cart.length === 0
    ? `<p class="text-center text-zinc-600 py-4 text-xs">Sin productos</p>`
    : cart.map((it,i) => `
      <div class="flex items-center gap-2 bg-zinc-950 p-2 rounded-lg">
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold truncate">${esc(it.nombre)}</p>
          <p class="text-[10px] text-zinc-500">${money(it.precio)}</p>
        </div>
        <button onclick="changeQty(${i},-1)" class="w-6 h-6 rounded bg-zinc-800 text-xs">−</button>
        <span class="text-xs font-bold w-5 text-center">${it.cantidad}</span>
        <button onclick="changeQty(${i},1)" class="w-6 h-6 rounded bg-zinc-800 text-xs">+</button>
      </div>
    `).join("");
}
function pay(m) {
  if (!cart.length) { alert("Carrito vacío"); return; }
  const sub = cart.reduce((s,i)=>s+i.precio*i.cantidad,0);
  const tax = sub * 0.12;
  SALES.unshift({
    id: uid(), fecha: new Date().toISOString(),
    cliente: $("#cliente").value || "Cliente", metodo: m,
    items: [...cart], subtotal: sub, impuesto: tax, total: sub+tax,
    vendedor: SESSION?.nombre || "Sistema"
  });
  wj(K.S, SALES);
  cart = []; renderCart(); renderStats(); renderFin(); renderCash();
  alert(`✅ Venta registrada: ${money(sub+tax)} (${m})`);
}

// ==================== MENU ====================
function renderMenu() {
  $("#sizesBox").innerHTML = MENU.tamanos.map(t => `
    <div class="card text-center">
      <p class="text-[10px] text-zinc-500 font-bold uppercase">${esc(t.label)}</p>
      <p class="text-lg font-bold text-amber-400">${money(t.precio)}</p>
      <p class="text-[10px] text-zinc-500">${t.porciones} porc.</p>
    </div>`).join("");
  $("#pizzaList").innerHTML = MENU.pizzas.map(p => `
    <div class="card flex gap-3 items-center">
      <div class="w-14 h-14 rounded-lg overflow-hidden bg-zinc-800 shrink-0">
        <img src="${imgOf(p.nombre)}" class="w-full h-full object-cover" onerror="this.src='${IMG.def}'">
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm truncate">${esc(p.nombre)}</p>
        <p class="text-[11px] text-zinc-500 truncate">${esc(p.desc||"")}</p>
      </div>
      <button onclick="editPizza(${p.id})" class="w-8 h-8 rounded bg-zinc-800 text-xs"><i class="fa-solid fa-pen"></i></button>
      <button onclick="delPizza(${p.id})" class="w-8 h-8 rounded bg-zinc-800 text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
    </div>`).join("");
}
function editPizza(id) {
  const p = id === 0 ? { id:uid(), nombre:"", desc:"", badge:"" } : MENU.pizzas.find(x => x.id === id);
  modal(`
    <h3 class="font-bold mb-4">${id?"Editar":"Nueva"} pizza</h3>

const monthKey = () => new Date().toISOString().slice(0,7);
function renderFin() {
  const m = monthKey();
  const inc = SALES.filter(s => s.fecha.slice(0,7) === m).reduce((a,s) => a+s.total, 0);
  const payPaid = PAY.filter(p => (p.fecha||"").slice(0,7) === m).reduce((a,p) => a+p.monto, 0);
  const expSum = EXP.filter(e => e.fecha.slice(0,7) === m).reduce((a,e) => a+e.monto, 0);
  const debtPaid = DEBT.filter(d => (d.fechaPago||"").slice(0,7) === m && d.pagado).reduce((a,d) => a+d.monto, 0);
  const totalEx = payPaid + expSum + debtPaid;
  const payExp = STAFF.reduce((a,s) => a+(s.sueldo||0), 0);
  const bal = inc - totalEx;

  $("#fIn").textContent = money(inc);
  $("#fEx").textContent = money(totalEx);
  $("#fPay").textContent = money(payExp);
  $("#fBal").textContent = money(bal);
  $("#fBal").style.color = bal >= 0 ? "#34d399" : "#f87171";

  // Sueldos
  $("#salaryList").innerHTML = STAFF.map(s => {
    const paid = PAY.filter(p => p.staffId === s.id && (p.fecha||"").slice(0,7) === m).reduce((a,p) => a+p.monto, 0);
    const pend = Math.max(0, (s.sueldo||0) - paid);
    return `
      <div class="card">
        <div class="flex justify-between items-start mb-2">
          <div>
            <p class="font-semibold text-sm">${esc(s.nombre)}</p>

          </div>

            <p class="text-sm font-bold ${pend>0?"text-red-400":"text-emerald-400"}">${money(pend)}</p>
          </div>
        </div>
        <p class="text-[11px] text-zinc-500 mb-2">Pagado: <b class="text-emerald-400">${money(paid)}</b></p>
        <div class="flex gap-2">
          <button onclick="paySalary(${s.id})" class="flex-1 bg-emerald-600/30 text-emerald-400 py-1.5 rounded text-xs">💵 Pagar</button>

          <p class="text-[11px] text-zinc-500">${esc(e.categoria||"General")} · ${new Date(e.fecha).toLocaleDateString("es-EC")}</p>
        </div>
        <p class="text-red-400 font-bold text-sm">-${money(e.monto)}</p>
        <button onclick="delExpense(${e.id})" class="text-zinc-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
      </div>`).join("");

  // Deudas
  $("#debtList").innerHTML = DEBT.length === 0
    ? `<p class="text-center text-zinc-500 py-6 text-xs">Sin deudas 🎉</p>`
    : DEBT.map(d => `
      <div class="card ${d.pagado?"border-emerald-600/40 opacity-60":"border-amber-600/40"}">
        <div class="flex justify-between items-start mb-2">
          <div class="min-w-0">
            <p class="font-semibold text-sm truncate">${esc(d.acreedor)}</p>

            <p class="text-[10px] text-zinc-500">${d.vence?new Date(d.vence).toLocaleDateString("es-EC"):"—"}</p>
          </div>
        </div>
        <div class="flex gap-2">
          ${!d.pagado?`<button onclick="payDebt(${d.id})" class="flex-1 bg-emerald-600/30 text-emerald-400 py-1.5 rounded text-xs">✓ Pagar</button>`:""}
          <button onclick="delDebt(${d.id})" class="flex-1 bg-zinc-800 text-red-400 py-1.5 rounded text-xs">Eliminar</button>

function renderCash() {
  const today = new Date().toISOString().slice(0,10);
  const c = CASH.find(x => x.fecha === today);
  const salesToday = SALES.filter(s => s.fecha.slice(0,10) === today);
  const cashSales = salesToday.filter(s => s.metodo === "Efectivo").reduce((a,s) => a+s.total, 0);
  const isOpen = c && !c.cerrada;

  $("#kState").textContent = isOpen ? "ABIERTA" : "CERRADA";
  $("#kState").style.color = isOpen ? "#34d399" : "#a1a1aa";
  const exp = (c?.montoApertura || 0) + cashSales;
  $("#kExp").textContent = money(exp);
  const counted = c?.montoContado ?? null;
  const dif = counted !== null ? counted - exp : 0;
  $("#kDif").textContent = counted !== null ? money(dif) : "$0";
  $("#kDif").style.color = counted === null ? "#fff" : Math.abs(dif) < 0.5 ? "#34d399" : "#f87171";
  $("#cashHint").textContent = `💵 ${money(cashSales)} efectivo · 💳 ${money(salesToday.filter(s=>s.metodo==="Tarjeta").reduce((a,s)=>a+s.total,0))} tarjeta`;

  $("#cashHist").innerHTML = CASH.length === 0
    ? `<p class="text-center text-zinc-500 py-4 text-xs">Sin cierres</p>`
    : CASH.slice().reverse().slice(0,10).map(c => {
      const d = c.diferencia ?? 0;
      return `
        <div class="card flex justify-between items-center">
          <div>
            <p class="text-xs font-semibold">${new Date(c.fecha).toLocaleDateString("es-EC")}</p>
            <p class="text-[10px] text-zinc-500">Apertura ${money(c.montoApertura)} · Contado ${money(c.montoContado||0)}</p>
          </div>
          <p class="text-sm font-bold ${Math.abs(d)<0.5?"text-emerald-400":"text-red-400"}">${money(d)}</p>
        </div>`;
    }).join("");
}
function openCash() {
  const amt = parseFloat($("#cashOpen").value) || 0;
  if (amt <= 0) { alert("Ingresa el monto"); return; }
  const today = new Date().toISOString().slice(0,10);
  if (CASH.find(c => c.fecha === today && !c.cerrada)) { alert("Ya hay caja abierta"); return; }
  CASH.push({ id: uid(), fecha: today, apertura: new Date().toISOString(), montoApertura: amt, cerrada: false, abiertaPor: SESSION?.nombre || "Sistema" });
  wj(K.C, CASH); renderCash();
}
function closeCash() {
  const today = new Date().toISOString().slice(0,10);
  const c = CASH.find(x => x.fecha === today && !x.cerrada);
  if (!c) { alert("No hay caja abierta"); return; }
  const cnt = parseFloat($("#cashCount").value);
  if (isNaN(cnt)) { alert("Ingresa el efectivo contado"); return; }
  const cs = SALES.filter(s => s.fecha.slice(0,10) === today && s.metodo === "Efectivo").reduce((a,s) => a+s.total, 0);
  const exp = c.montoApertura + cs;
  c.cerrada = true; c.cierre = new Date().toISOString();
  c.montoContado = cnt; c.esperado = exp; c.diferencia = cnt - exp;
  c.cerradaPor = SESSION?.nombre || "Sistema";
  wj(K.C, CASH); renderCash();
  alert(`Caja cerrada. Diferencia: ${money(c.diferencia)}`);
}

  try { renderFin(); } catch(e) { console.error("Fin:", e); }
  try { renderCash(); } catch(e) { console.error("Cash:", e); }
  try { renderStats(); } catch(e) { console.error("Stats:", e); }
}

// ==================== INIT ====================
if (SESSION && STAFF.find(s => s.id === SESSION.id)) {
  startApp();
}
</script>
